<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 夜空渐变 -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050714;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1535;stop-opacity:1" />
    </linearGradient>
    
    <!-- 星座连线发光 -->
    <filter id="constellationGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 星星发光 -->
    <filter id="brightStar" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#nightSky)"/>
  
  <!-- 背景星星 -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="50" r="0.8"/>
    <circle cx="300" cy="120" r="0.6"/>
    <circle cx="500" cy="80" r="0.9"/>
    <circle cx="700" cy="150" r="0.7"/>
    <circle cx="900" cy="60" r="1"/>
    <circle cx="1100" cy="130" r="0.8"/>
    <circle cx="1300" cy="70" r="0.9"/>
    <circle cx="1500" cy="140" r="0.6"/>
    <circle cx="1700" cy="90" r="0.8"/>
    <circle cx="1900" cy="160" r="1"/>
    
    <circle cx="200" cy="250" r="0.7"/>
    <circle cx="400" cy="300" r="0.9"/>
    <circle cx="600" cy="220" r="0.8"/>
    <circle cx="800" cy="280" r="0.6"/>
    <circle cx="1000" cy="200" r="1"/>
    <circle cx="1200" cy="320" r="0.7"/>
    <circle cx="1400" cy="240" r="0.9"/>
    <circle cx="1600" cy="310" r="0.8"/>
    <circle cx="1800" cy="230" r="0.6"/>
    
    <circle cx="150" cy="450" r="0.8"/>
    <circle cx="350" cy="500" r="0.6"/>
    <circle cx="550" cy="420" r="1"/>
    <circle cx="750" cy="480" r="0.7"/>
    <circle cx="950" cy="400" r="0.9"/>
    <circle cx="1150" cy="520" r="0.8"/>
    <circle cx="1350" cy="440" r="0.6"/>
    <circle cx="1550" cy="510" r="1"/>
    <circle cx="1750" cy="430" r="0.7"/>
    
    <circle cx="250" cy="650" r="0.9"/>
    <circle cx="450" cy="700" r="0.7"/>
    <circle cx="650" cy="620" r="0.8"/>
    <circle cx="850" cy="680" r="1"/>
    <circle cx="1050" cy="600" r="0.6"/>
    <circle cx="1250" cy="720" r="0.9"/>
    <circle cx="1450" cy="640" r="0.7"/>
    <circle cx="1650" cy="710" r="0.8"/>
    <circle cx="1850" cy="630" r="0.6"/>
    
    <circle cx="100" cy="850" r="1"/>
    <circle cx="300" cy="900" r="0.8"/>
    <circle cx="500" cy="820" r="0.6"/>
    <circle cx="700" cy="880" r="0.9"/>
    <circle cx="900" cy="800" r="0.7"/>
    <circle cx="1100" cy="920" r="1"/>
    <circle cx="1300" cy="840" r="0.8"/>
    <circle cx="1500" cy="910" r="0.6"/>
    <circle cx="1700" cy="830" r="0.9"/>
    <circle cx="1900" cy="890" r="0.7"/>
  </g>
  
  <!-- 星座1: 北斗七星样式 -->
  <g opacity="0.8" filter="url(#constellationGlow)">
    <!-- 连线 -->
    <polyline points="300,200 380,220 420,280 480,320 550,340 620,300 700,280" 
              fill="none" stroke="#64b5f6" stroke-width="1.5" opacity="0.5"/>
    <!-- 星星 -->
    <circle cx="300" cy="200" r="3" fill="#90caf9" filter="url(#brightStar)"/>
    <circle cx="380" cy="220" r="2.5" fill="#90caf9"/>
    <circle cx="420" cy="280" r="2.8" fill="#90caf9" filter="url(#brightStar)"/>
    <circle cx="480" cy="320" r="2.5" fill="#90caf9"/>
    <circle cx="550" cy="340" r="3" fill="#90caf9" filter="url(#brightStar)"/>
    <circle cx="620" cy="300" r="2.5" fill="#90caf9"/>
    <circle cx="700" cy="280" r="3.2" fill="#64b5f6" filter="url(#brightStar)"/>
  </g>
  
  <!-- 星座2: 猎户座样式 -->
  <g opacity="0.8" filter="url(#constellationGlow)">
    <!-- 连线 -->
    <line x1="1200" y1="150" x2="1280" y2="200" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1280" y1="200" x2="1260" y2="300" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1200" y1="150" x2="1180" y2="250" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1180" y1="250" x2="1260" y2="300" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1200" y1="150" x2="1400" y2="180" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1280" y1="200" x2="1420" y2="220" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <line x1="1400" y1="180" x2="1420" y2="220" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
    <!-- 星星 -->
    <circle cx="1200" cy="150" r="3.5" fill="#f8bbd0" filter="url(#brightStar)"/>
    <circle cx="1280" cy="200" r="3" fill="#f48fb1" filter="url(#brightStar)"/>
    <circle cx="1180" cy="250" r="2.5" fill="#f8bbd0"/>
    <circle cx="1260" cy="300" r="2.8" fill="#f48fb1"/>
    <circle cx="1400" cy="180" r="3.2" fill="#f8bbd0" filter="url(#brightStar)"/>
    <circle cx="1420" cy="220" r="3" fill="#f48fb1" filter="url(#brightStar)"/>
  </g>
  
  <!-- 星座3: 仙女座样式 -->
  <g opacity="0.8" filter="url(#constellationGlow)">
    <!-- 连线 -->
    <polyline points="150,500 220,480 300,520 400,500" 
              fill="none" stroke="#80cbc4" stroke-width="1.5" opacity="0.5"/>
    <line x1="220" y1="480" x2="250" y2="550" stroke="#80cbc4" stroke-width="1.5" opacity="0.5"/>
    <line x1="300" y1="520" x2="350" y2="580" stroke="#80cbc4" stroke-width="1.5" opacity="0.5"/>
    <!-- 星星 -->
    <circle cx="150" cy="500" r="2.8" fill="#80cbc4" filter="url(#brightStar)"/>
    <circle cx="220" cy="480" r="3" fill="#80cbc4" filter="url(#brightStar)"/>
    <circle cx="300" cy="520" r="2.5" fill="#80cbc4"/>
    <circle cx="400" cy="500" r="3.2" fill="#4db6ac" filter="url(#brightStar)"/>
    <circle cx="250" cy="550" r="2.5" fill="#80cbc4"/>
    <circle cx="350" cy="580" r="2.8" fill="#80cbc4"/>
  </g>
  
  <!-- 星座4: 天鹅座样式 -->
  <g opacity="0.8" filter="url(#constellationGlow)">
    <!-- 连线 -->
    <line x1="1500" y1="400" x2="1600" y2="480" stroke="#ce93d8" stroke-width="1.5" opacity="0.5"/>
    <line x1="1600" y1="480" x2="1700" y2="420" stroke="#ce93d8" stroke-width="1.5" opacity="0.5"/>
    <line x1="1600" y1="480" x2="1620" y2="580" stroke="#ce93d8" stroke-width="1.5" opacity="0.5"/>
    <line x1="1600" y1="480" x2="1580" y2="380" stroke="#ce93d8" stroke-width="1.5" opacity="0.5"/>
    <!-- 星星 -->
    <circle cx="1500" cy="400" r="3" fill="#ce93d8" filter="url(#brightStar)"/>
    <circle cx="1600" cy="480" r="3.5" fill="#e1bee7" filter="url(#brightStar)"/>
    <circle cx="1700" cy="420" r="2.8" fill="#ce93d8"/>
    <circle cx="1620" cy="580" r="2.5" fill="#ce93d8"/>
    <circle cx="1580" cy="380" r="2.8" fill="#ce93d8"/>
  </g>
  
  <!-- 星座5: 天蝎座样式 -->
  <g opacity="0.8" filter="url(#constellationGlow)">
    <!-- 连线 -->
    <polyline points="900,700 950,750 1020,780 1100,760 1180,790 1250,750 1320,770" 
              fill="none" stroke="#ffcc80" stroke-width="1.5" opacity="0.5"/>
    <line x1="950" y1="750" x2="920" y2="820" stroke="#ffcc80" stroke-width="1.5" opacity="0.5"/>
    <line x1="1020" y1="780" x2="1000" y2="850" stroke="#ffcc80" stroke-width="1.5" opacity="0.5"/>
    <line x1="1100" y1="760" x2="1120" y2="830" stroke="#ffcc80" stroke-width="1.5" opacity="0.5"/>
    <!-- 星星 -->
    <circle cx="900" cy="700" r="2.5" fill="#ffe0b2"/>
    <circle cx="950" cy="750" r="3" fill="#ffcc80" filter="url(#brightStar)"/>
    <circle cx="1020" cy="780" r="2.8" fill="#ffcc80"/>
    <circle cx="1100" cy="760" r="3.2" fill="#ffb74d" filter="url(#brightStar)"/>
    <circle cx="1180" cy="790" r="2.5" fill="#ffcc80"/>
    <circle cx="1250" cy="750" r="3" fill="#ffcc80"/>
    <circle cx="1320" cy="770" r="3.5" fill="#ffa726" filter="url(#brightStar)"/>
    <circle cx="920" cy="820" r="2.5" fill="#ffcc80"/>
    <circle cx="1000" cy="850" r="2.8" fill="#ffe0b2"/>
    <circle cx="1120" cy="830" r="2.5" fill="#ffcc80"/>
  </g>
  
  <!-- 银河光带 -->
  <ellipse cx="960" cy="450" rx="1200" ry="250" fill="#ffffff" opacity="0.03" transform="rotate(-15 960 450)"/>
  <ellipse cx="960" cy="450" rx="1000" ry="180" fill="#e3f2fd" opacity="0.04" transform="rotate(-15 960 450)"/>
</svg>