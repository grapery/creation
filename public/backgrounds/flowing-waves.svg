<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 深海渐变 -->
    <linearGradient id="deepOcean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#001f3f;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#004080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:1" />
    </linearGradient>
    
    <!-- 波浪渐变 -->
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#64b5f6;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="waveGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90caf9;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#90caf9;stop-opacity:0" />
    </linearGradient>
    
    <!-- 星光 -->
    <filter id="twinkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#deepOcean)"/>
  
  <!-- 星星（海面上的星空） -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="100" cy="50" r="1"/>
    <circle cx="250" cy="80" r="0.8" opacity="0.6"/>
    <circle cx="400" cy="40" r="1.2" filter="url(#twinkle)"/>
    <circle cx="550" cy="100" r="0.9" opacity="0.5"/>
    <circle cx="700" cy="60" r="1.1"/>
    <circle cx="850" cy="90" r="0.8" opacity="0.6"/>
    <circle cx="1000" cy="45" r="1.3" filter="url(#twinkle)"/>
    <circle cx="1150" cy="110" r="1" opacity="0.7"/>
    <circle cx="1300" cy="55" r="0.9"/>
    <circle cx="1450" cy="95" r="1.1" opacity="0.6"/>
    <circle cx="1600" cy="70" r="1.2" filter="url(#twinkle)"/>
    <circle cx="1750" cy="105" r="0.8" opacity="0.5"/>
    <circle cx="1900" cy="50" r="1"/>
    
    <circle cx="150" cy="150" r="0.9" opacity="0.6"/>
    <circle cx="350" cy="180" r="1.1"/>
    <circle cx="500" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="650" cy="200" r="1.2" filter="url(#twinkle)"/>
    <circle cx="800" cy="160" r="1" opacity="0.7"/>
    <circle cx="950" cy="190" r="0.9"/>
    <circle cx="1100" cy="145" r="1.1" opacity="0.6"/>
    <circle cx="1250" cy="210" r="0.8" opacity="0.5"/>
    <circle cx="1400" cy="170" r="1.2" filter="url(#twinkle)"/>
    <circle cx="1550" cy="200" r="1" opacity="0.7"/>
    <circle cx="1700" cy="155" r="0.9"/>
    <circle cx="1850" cy="185" r="1.1" opacity="0.6"/>
  </g>
  
  <!-- 亮星 -->
  <g fill="#ffffff" filter="url(#twinkle)">
    <circle cx="300" cy="100" r="2" opacity="0.9"/>
    <circle cx="800" cy="120" r="2.5" opacity="0.85"/>
    <circle cx="1300" cy="80" r="2.2" opacity="0.9"/>
    <circle cx="600" cy="180" r="2" opacity="0.8"/>
    <circle cx="1500" cy="150" r="2.3" opacity="0.85"/>
    <circle cx="100" cy="200" r="2.1" opacity="0.8"/>
    <circle cx="1800" cy="170" r="2.4" opacity="0.9"/>
  </g>
  
  <!-- 波浪层1 - 最底层 -->
  <path d="M0,350 
           C160,330 320,370 480,350 
           C640,330 800,370 960,350 
           C1120,330 1280,370 1440,350 
           C1600,330 1760,370 1920,350 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient1)" opacity="0.6"/>
  
  <!-- 波浪层2 -->
  <path d="M0,400 
           C200,380 400,420 600,400 
           C800,380 1000,420 1200,400 
           C1400,380 1600,420 1920,400 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient2)" opacity="0.5"/>
  
  <!-- 波浪层3 -->
  <path d="M0,450 
           C240,430 480,470 720,450 
           C960,430 1200,470 1440,450 
           C1680,430 1800,470 1920,450 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient3)" opacity="0.4"/>
  
  <!-- 波浪层4 -->
  <path d="M0,520 
           C320,500 640,540 960,520 
           C1280,500 1600,540 1920,520 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient1)" opacity="0.35"/>
  
  <!-- 波浪层5 -->
  <path d="M0,600 
           C400,580 800,620 1200,600 
           C1600,580 1800,620 1920,600 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient2)" opacity="0.3"/>
  
  <!-- 波浪层6 -->
  <path d="M0,700 
           C480,680 960,720 1440,700 
           C1680,680 1800,720 1920,700 
           L1920,1080 L0,1080 Z" 
        fill="url(#waveGradient3)" opacity="0.25"/>
  
  <!-- 波浪线条 -->
  <g fill="none" stroke="#4a90e2" stroke-width="1" opacity="0.2">
    <path d="M0,380 Q480,360 960,380 T1920,380"/>
    <path d="M0,420 Q480,400 960,420 T1920,420"/>
    <path d="M0,480 Q480,460 960,480 T1920,480"/>
    <path d="M0,550 Q480,530 960,550 T1920,550"/>
    <path d="M0,630 Q480,610 960,630 T1920,630"/>
    <path d="M0,750 Q480,730 960,750 T1920,750"/>
    <path d="M0,850 Q480,830 960,850 T1920,850"/>
    <path d="M0,950 Q480,930 960,950 T1920,950"/>
  </g>
  
  <!-- 星光反射在水面 -->
  <g fill="#ffffff" opacity="0.15">
    <ellipse cx="300" cy="500" rx="30" ry="3"/>
    <ellipse cx="800" cy="550" rx="40" ry="4"/>
    <ellipse cx="1300" cy="480" rx="35" ry="3.5"/>
    <ellipse cx="600" cy="650" rx="25" ry="2.5"/>
    <ellipse cx="1500" cy="700" rx="45" ry="4.5"/>
    <ellipse cx="100" cy="750" rx="20" ry="2"/>
    <ellipse cx="1800" cy="600" rx="35" ry="3.5"/>
    
    <ellipse cx="450" cy="800" rx="28" ry="2.8" opacity="0.1"/>
    <ellipse cx="950" cy="850" rx="32" ry="3.2" opacity="0.12"/>
    <ellipse cx="1450" cy="900" rx="38" ry="3.8" opacity="0.1"/>
    <ellipse cx="250" cy="950" rx="22" ry="2.2" opacity="0.08"/>
    <ellipse cx="750" cy="1000" rx="30" ry="3" opacity="0.1"/>
    <ellipse cx="1250" cy="1050" rx="35" ry="3.5" opacity="0.08"/>
    <ellipse cx="1750" cy="980" rx="25" ry="2.5" opacity="0.1"/>
  </g>
  
  <!-- 深海底部的光点 -->
  <g fill="#64b5f6" opacity="0.1">
    <circle cx="200" cy="950" r="2"/>
    <circle cx="500" cy="1000" r="1.5"/>
    <circle cx="800" cy="920" r="2.2"/>
    <circle cx="1100" cy="980" r="1.8"/>
    <circle cx="1400" cy="940" r="2.5"/>
    <circle cx="1700" cy="1020" r="2"/>
    <circle cx="350" cy="1050" r="1.6"/>
    <circle cx="650" cy="900" r="2.3"/>
    <circle cx="950" cy="1060" r="1.9"/>
    <circle cx="1250" cy="880" r="2.4"/>
    <circle cx="1550" cy="1040" r="2.1"/>
    <circle cx="1850" cy="960" r="1.7"/>
  </g>
</svg>