<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 深邃夜空渐变 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1f4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3561;stop-opacity:1" />
    </linearGradient>
    
    <!-- 星星发光滤镜 -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 大星星发光 -->
    <filter id="brightStar" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 银河渐变 -->
    <radialGradient id="milkyWay" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#2d3748;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  
  <!-- 银河光带 -->
  <ellipse cx="960" cy="300" rx="1200" ry="400" fill="url(#milkyWay)" opacity="0.6" transform="rotate(-15 960 300)"/>
  
  <!-- 随机分布的星星 -->
  <g fill="#ffffff" opacity="0.8">
    <!-- 小星星 -->
    <circle cx="100" cy="50" r="1" opacity="0.6"/>
    <circle cx="250" cy="120" r="0.8" opacity="0.4"/>
    <circle cx="400" cy="80" r="1.2" opacity="0.7"/>
    <circle cx="550" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="700" cy="60" r="1" opacity="0.6"/>
    <circle cx="850" cy="180" r="0.7" opacity="0.4"/>
    <circle cx="1000" cy="90" r="1.1" opacity="0.8"/>
    <circle cx="1150" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="1300" cy="70" r="1" opacity="0.6"/>
    <circle cx="1450" cy="160" r="0.9" opacity="0.4"/>
    <circle cx="1600" cy="85" r="1.2" opacity="0.7"/>
    <circle cx="1750" cy="130" r="0.8" opacity="0.5"/>
    <circle cx="1900" cy="55" r="1" opacity="0.6"/>
    
    <circle cx="150" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="280" r="1.1" opacity="0.7"/>
    <circle cx="450" cy="220" r="0.8" opacity="0.4"/>
    <circle cx="600" cy="300" r="1" opacity="0.6"/>
    <circle cx="750" cy="250" r="0.7" opacity="0.3"/>
    <circle cx="900" cy="320" r="1.2" opacity="0.8"/>
    <circle cx="1050" cy="210" r="0.9" opacity="0.5"/>
    <circle cx="1200" cy="290" r="1" opacity="0.6"/>
    <circle cx="1350" cy="230" r="0.8" opacity="0.4"/>
    <circle cx="1500" cy="310" r="1.1" opacity="0.7"/>
    <circle cx="1650" cy="240" r="0.9" opacity="0.5"/>
    <circle cx="1800" cy="295" r="1" opacity="0.6"/>
    
    <!-- 第二屏星星 -->
    <circle cx="80" cy="400" r="1" opacity="0.6"/>
    <circle cx="220" cy="480" r="0.8" opacity="0.4"/>
    <circle cx="380" cy="420" r="1.2" opacity="0.7"/>
    <circle cx="520" cy="500" r="0.9" opacity="0.5"/>
    <circle cx="680" cy="450" r="1" opacity="0.6"/>
    <circle cx="820" cy="520" r="0.7" opacity="0.4"/>
    <circle cx="980" cy="440" r="1.1" opacity="0.8"/>
    <circle cx="1120" cy="510" r="0.8" opacity="0.5"/>
    <circle cx="1280" cy="460" r="1" opacity="0.6"/>
    <circle cx="1420" cy="530" r="0.9" opacity="0.4"/>
    <circle cx="1580" cy="470" r="1.2" opacity="0.7"/>
    <circle cx="1720" cy="540" r="0.8" opacity="0.5"/>
    <circle cx="1880" cy="430" r="1" opacity="0.6"/>
    
    <circle cx="120" cy="650" r="0.9" opacity="0.5"/>
    <circle cx="280" cy="720" r="1.1" opacity="0.7"/>
    <circle cx="420" cy="680" r="0.8" opacity="0.4"/>
    <circle cx="580" cy="750" r="1" opacity="0.6"/>
    <circle cx="720" cy="640" r="0.7" opacity="0.3"/>
    <circle cx="880" cy="710" r="1.2" opacity="0.8"/>
    <circle cx="1020" cy="660" r="0.9" opacity="0.5"/>
    <circle cx="1180" cy="730" r="1" opacity="0.6"/>
    <circle cx="1320" cy="690" r="0.8" opacity="0.4"/>
    <circle cx="1480" cy="760" r="1.1" opacity="0.7"/>
    <circle cx="1620" cy="670" r="0.9" opacity="0.5"/>
    <circle cx="1780" cy="740" r="1" opacity="0.6"/>
    
    <!-- 底部更多星星 -->
    <circle cx="50" cy="850" r="1" opacity="0.6"/>
    <circle cx="200" cy="920" r="0.8" opacity="0.4"/>
    <circle cx="350" cy="880" r="1.2" opacity="0.7"/>
    <circle cx="500" cy="950" r="0.9" opacity="0.5"/>
    <circle cx="650" cy="860" r="1" opacity="0.6"/>
    <circle cx="800" cy="930" r="0.7" opacity="0.4"/>
    <circle cx="950" cy="890" r="1.1" opacity="0.8"/>
    <circle cx="1100" cy="960" r="0.8" opacity="0.5"/>
    <circle cx="1250" cy="870" r="1" opacity="0.6"/>
    <circle cx="1400" cy="940" r="0.9" opacity="0.4"/>
    <circle cx="1550" cy="900" r="1.2" opacity="0.7"/>
    <circle cx="1700" cy="970" r="0.8" opacity="0.5"/>
    <circle cx="1850" cy="880" r="1" opacity="0.6"/>
  </g>
  
  <!-- 闪亮的星星（带发光效果） -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="300" cy="150" r="2" opacity="0.9"/>
    <circle cx="800" cy="200" r="2.5" opacity="0.85"/>
    <circle cx="1400" cy="120" r="2" opacity="0.9"/>
    <circle cx="600" cy="400" r="2.2" opacity="0.8"/>
    <circle cx="1200" cy="350" r="2" opacity="0.85"/>
    <circle cx="1700" cy="450" r="2.3" opacity="0.8"/>
    <circle cx="200" cy="600" r="2" opacity="0.9"/>
    <circle cx="900" cy="550" r="2.5" opacity="0.85"/>
    <circle cx="1600" cy="620" r="2" opacity="0.9"/>
    <circle cx="400" cy="800" r="2.2" opacity="0.8"/>
    <circle cx="1100" cy="850" r="2" opacity="0.85"/>
    <circle cx="1750" cy="780" r="2.3" opacity="0.8"/>
  </g>
  
  <!-- 最亮的星 -->
  <g fill="#ffffff" filter="url(#brightStar)">
    <circle cx="500" cy="300" r="3" opacity="1"/>
    <circle cx="1000" cy="250" r="3.5" opacity="0.95"/>
    <circle cx="1500" cy="380" r="3" opacity="1"/>
    <circle cx="350" cy="700" r="3.2" opacity="0.9"/>
    <circle cx="1300" cy="600" r="3" opacity="0.95"/>
    <circle cx="1800" cy="720" r="3.5" opacity="0.9"/>
  </g>
  
  <!-- 流星 -->
  <g opacity="0.6">
    <line x1="200" y1="100" x2="350" y2="180" stroke="url(#shootingStar)" stroke-width="2" stroke-linecap="round"/>
    <line x1="1400" y1="80" x2="1600" y2="200" stroke="url(#shootingStar)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="800" y1="600" x2="950" y2="720" stroke="url(#shootingStar)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <defs>
    <linearGradient id="shootingStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>