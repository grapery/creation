name: creation-frontend-ci

on:
  push:
    paths:
      - 'creation/**'
      - '.github/workflows/creation-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'creation/**'
      - '.github/workflows/creation-ci.yml'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/creation

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: creation/package-lock.json

      - name: Install dependencies
        working-directory: creation
        run: npm ci

      - name: Run ESLint
        working-directory: creation
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript check
        working-directory: creation
        run: npx tsc --noEmit

      - name: Check formatting
        working-directory: creation
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,css,md}"
        continue-on-error: true

  # 测试
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: creation/package-lock.json

      - name: Install dependencies
        working-directory: creation
        run: npm ci

      - name: Run tests
        working-directory: creation
        run: npm test -- --coverage --watchAll=false
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./creation/coverage/coverage-final.json
          flags: frontend
          name: creation-frontend

  # 构建
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        environment: [production, staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: creation/package-lock.json

      - name: Install dependencies
        working-directory: creation
        run: npm ci

      - name: Build application
        working-directory: creation
        env:
          NODE_ENV: ${{ matrix.environment }}
          VITE_API_BASE_URL: ${{ matrix.environment == 'production' && 'https://api.yourdomain.com' || 'https://api-staging.yourdomain.com' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: creation-dist-${{ matrix.environment }}
          path: creation/dist
          retention-days: 7

      - name: Generate build report
        working-directory: creation
        run: |
          echo "## Build Report - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build size:" >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "File count:" >> $GITHUB_STEP_SUMMARY
          find dist -type f | wc -l >> $GITHUB_STEP_SUMMARY

  # Docker 构建
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: creation-dist-production
          path: creation/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        working-directory: creation
        run: |
          cat > Dockerfile << 'EOF'
          FROM nginx:alpine
          COPY dist /usr/share/nginx/html
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Create nginx config
        working-directory: creation
        run: |
          cat > nginx.conf << 'EOF'
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /api {
                  proxy_pass http://backend:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
          }
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./creation
          file: ./creation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "✅ Docker image built and pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY

